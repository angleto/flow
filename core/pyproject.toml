[project]
name = "mycelium-core"
version = "0.0.0"
description = "Mycelium core: dominio + service layer (unico punto di verita)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "cryptography>=43",
    "pgvector>=0.3",
    "reportlab>=4",
    "boto3>=1.34",
    "httpx>=0.27",
    "lxml>=5",
    "signxml>=4",
    # Web Push (RFC 8030/8291): encrypts + VAPID-signs browser push
    # payloads. Sync (requests-based) so the sender wraps it in
    # asyncio.to_thread, like the SMTP mailer.
    "pywebpush>=2",
    # Markdown anchor resolution for inline suggestions (services/md_anchor):
    # mirrors the editor's markdown-it so accept resolves rendered-text
    # anchors against the markdown source. Already resolved transitively
    # (via rich); pinned here as a direct dependency of the owning package.
    "markdown-it-py>=3",
]

# Opt-in local embedder (ADR-0012): the privacy-first default runs a
# local sentence-transformers model. Heavy (pulls torch); kept optional
# so CI/dev without it inject a fake embedder. Enable with:
#   uv sync --extra local-embedder
# The >=3 floor is load-bearing since ADR-0061: LocalEmbedder reads the
# checkpoint's declared instruction prefixes (``model.prompts``) and passes
# ``prompt_name`` to ``encode``. Neither exists before 3.0, where the call
# would raise TypeError instead of embedding the query side correctly.
[project.optional-dependencies]
local-embedder = ["sentence-transformers>=3"]
# Opt-in local speech-to-text (ADR-0020, task 44ba3f14): LocalSTT is
# backed by faster-whisper (CTranslate2). Lazily imported, so CI/dev
# without it inject a fake STT; a deploy that wants Telegram voice
# transcription must ship it. Enable with: uv sync --extra stt
# Model/quantisation via MYCELIUM_STT_MODEL (default small) / MYCELIUM_STT_DEVICE
# / MYCELIUM_STT_COMPUTE_TYPE (default int8).
stt = ["faster-whisper>=1.0"]
# Opt-in graph clustering (task 8c0a8f08, ADR-0031 v2): Leiden community
# detection + modularity for the garden mindmap. Lazily imported in
# graph.compute_leiden_clusters, so CI/dev without it degrade to "no
# clusters" (modularity=null); a deploy that wants cluster-colouring +
# the ADR-0035 modularity sensor must ship it. Enable: uv sync --extra clustering
clustering = ["python-igraph>=0.11", "leidenalg>=0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycelium_core"]
