# Mycelium SPA + same-origin API proxy.
# Mirrors the Vite dev proxy: /api/* → backend with the /api prefix
# stripped (proxy_pass trailing slash), websocket upgrade preserved
# (realtime timer, W4). One public origin, so no CORS is needed.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Attachment uploads: the backend caps a file at
    # ``attachment_max_bytes`` (10 MiB default, core/config.py) and
    # returns a clean JSON ATTACHMENT_TOO_LARGE error past it. nginx's
    # default client_max_body_size is only 1 MB, so without this it 413s
    # any >1 MB upload with an HTML body the SPA can't parse, surfacing
    # the generic "Something went wrong." Keep this >= the backend cap
    # (here 10 MiB + multipart/encoding overhead) so the backend stays
    # the single authority on the size limit.
    client_max_body_size 12m;

    # Compression. The stock nginx image ships ``gzip`` commented out, so
    # without this block NOTHING is compressed: not the SPA bundle, not a
    # single API response. Measured on the JSON list endpoints, that is a
    # 5-9x multiplier on every byte the app sends.
    #
    # ``gzip_types`` is NOT optional: the default list is ``text/html``
    # alone, so ``gzip on`` by itself would leave application/json (the
    # bulk of the traffic) uncompressed. text/html is always compressed
    # and cannot appear in the list.
    #
    # ``gzip_proxied any``: nginx treats a request carrying a ``Via``
    # header as proxied and, at the default ``off``, refuses to compress
    # its response. The public LB in front of this pod can set ``Via``,
    # so leaving the default would silently disable compression in
    # production while it worked locally.
    #
    # Deliberately absent from ``gzip_types``: ``text/event-stream``.
    # gzip buffers, which would defeat an incremental response. There is
    # no SSE endpoint today; this note is here so adding one does not
    # quietly acquire a compression buffer.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Public Invoice REST API (issuer-API-key auth, ADR-0045). The backend
    # mounts this router at the FULL ``/api/v1`` prefix (unlike the SPA's
    # internal routers, which are un-prefixed and reached via the /api/ strip
    # below). So this must NOT strip: the longer prefix wins over ``/api/``,
    # and ``proxy_pass`` with NO path preserves the original URI verbatim, so
    # ``/api/v1/invoices`` reaches the backend as ``/api/v1/invoices``.
    # Without this, /api/ would rewrite it to /v1/invoices → 404 at the
    # documented URL. Same pattern as /mcp and /.well-known below.
    location /api/v1/ {
        proxy_pass http://mycelium-backend.mycelium-production.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Self-documenting REST API (commit "self-documenting system"): the
    # backend serves ReDoc at /apidocs and the schema at /openapi.json from
    # the root, so pass them through WITHOUT the /api/ strip (else the SPA
    # fallback returns index.html and the docs link dead-ends). ReDoc fetches
    # the schema relative to the host root.
    location = /apidocs {
        proxy_pass http://mycelium-backend.mycelium-production.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /openapi.json {
        proxy_pass http://mycelium-backend.mycelium-production.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API → backend Service (ClusterIP). Trailing slash on proxy_pass
    # rewrites /api/tasks → /tasks upstream.
    location /api/ {
        proxy_pass http://mycelium-backend.mycelium-production.svc.cluster.local:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (timer stream).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
    }

    # OAuth shim metadata endpoints (RFC 8414 + 9728): MCP clients
    # fetch /.well-known/oauth-authorization-server and
    # /.well-known/oauth-protected-resource from the host root, not
    # from /api/. Proxy these specific paths through to the backend
    # without the api/ rewrite. Without this, the SPA fallback below
    # serves index.html and Claude Desktop's connector handshake
    # dead-ends.
    location /.well-known/oauth-authorization-server {
        proxy_pass http://mycelium-backend.mycelium-production.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /.well-known/oauth-protected-resource {
        proxy_pass http://mycelium-backend.mycelium-production.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP transport (streamable-http) lives at /mcp inside the same
    # backend process (FastAPI sub-app), so pass through unchanged.
    # Bearer auth is enforced inside mycelium_mcp/server_http.
    # Long-lived chunked connections - disable buffering, raise the
    # read/send timeouts.
    location /mcp {
        proxy_pass http://mycelium-backend.mycelium-production.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Belt-and-braces: rewrite any http:// redirect Location the
        # backend emits (e.g. the /mcp -> /mcp/ 307) back to https so
        # Claude Desktop, which refuses an https->http downgrade,
        # follows it. The uvicorn --proxy-headers flag should already
        # make the backend emit https, this covers the edge.
        proxy_redirect http://$host/ https://$host/;
    }

    # SdI SDICoop inbound (RicezioneFatture push): SdI POSTs
    # notifications/invoices to /sdi/notification. Registered at AdE as
    # https://mycelium.xeno.garden/sdi/notification, so preserve the full path
    # (no trailing slash on proxy_pass, like /api/v1 and /mcp above) → the
    # sdi-inbound service serves POST /sdi/notification verbatim. A larger body
    # cap than the SPA default: an SdI-delivered FatturaElettronica (base64 in a
    # SOAP envelope) can run to a few MB with attachments.
    location /sdi/ {
        proxy_pass http://mycelium-sdi-inbound.mycelium-production.svc.cluster.local:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
        proxy_read_timeout 600s;
    }

    # SPA history fallback: every non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Cache policy for the three UNHASHED files -------------------
    #
    # Everything under /assets/ carries a content hash, so it is safe to
    # freeze forever. index.html, sw.js and version.json do NOT: their
    # URLs are stable and their content changes on every deploy. Served
    # with no Cache-Control at all (the nginx default), the browser falls
    # back to HEURISTIC freshness derived from Last-Modified and may reuse
    # a shell from the previous release without revalidating — which is a
    # second, independent way to get "I have to hard-reload" on top of the
    # service-worker one (web/public/sw.js).
    #
    # ``no-cache`` does NOT mean "do not store": it means "store, but
    # revalidate every time". So the 304 path still works and the bytes
    # still come from disk when unchanged; only the staleness goes away.

    # The SPA shell. Matched both directly and via the try_files internal
    # redirect above (an internal redirect re-runs location matching).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The service worker script. Browsers already bypass the HTTP cache
    # for the SW script itself in current specs, but an intermediary
    # (the LB, a corporate proxy) has no such rule: a cached sw.js pins
    # the caching strategy of a past release, which is exactly the bug
    # this file's neighbour was fixing.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # The build stamp the running SPA polls to notice a new deploy
    # (emitted by the vite plugin in web/vite.config.ts). ``no-store``,
    # not ``no-cache``: a revalidation that returns 304 is fine for the
    # client but this document is 40 bytes, and any layer holding a copy
    # would delay exactly the signal it exists to deliver.
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # ---- The browser extension package ------------------------------
    #
    # Served as files, not through the SPA fallback: without a location
    # of its own, `location /` would answer a missing archive with
    # index.html and a 200, so the settings page would be parsing the app
    # shell as a descriptor. `=404` is the honest answer, and it is also
    # the normal one on an image built without an extension origin.
    #
    # The descriptor first, because a prefix location loses to nothing
    # here except an exact one. Its URL is stable and its content changes
    # with every release, so it revalidates; the archive carries its
    # version in the file name and can be frozen.
    location = /extension/release.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /extension/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static assets: long cache (Vite emits content-hashed filenames).
    # One Cache-Control header, not two: ``expires 1y`` emits its own
    # ``Cache-Control: max-age=...`` which the add_header then duplicated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# $connection_upgrade = "upgrade" when the client asked for it, else
# "close" — required for correct WebSocket proxying.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
