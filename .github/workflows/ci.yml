name: CI

# Trigger policy (per operator request): fire only on tag pushes,
# not on every branch commit. The release mycelium is tag-driven (each
# v1.X.Y goes through tag-push -> build-images -> deploy), so the
# CI gate runs at the same boundary the operator already cares
# about. ``workflow_dispatch`` is kept for manual ad-hoc runs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy -p mycelium_core -p mycelium_api -p mycelium_mcp -p mycelium_worker -p mycelium_sdi_inbound
      - name: MCP coverage doc is current (generated from the live registry)
        run: uv run python scripts/gen_mcp_coverage.py --check
      - name: Validate compose
        run: docker compose -f deploy/local/docker-compose.yml config -q

  tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mycelium
          POSTGRES_PASSWORD: mycelium
          POSTGRES_DB: mycelium
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mycelium -d mycelium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MYCELIUM_JWT_SECRET: ci-only-secret-minimum-32-bytes-xxxxxxxx
      MYCELIUM_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Fail-closed like the JWT secret (issuer-key feature): the app boots
      # Settings directly here, with no pytest conftest default to fall
      # back on.
      MYCELIUM_ISSUER_KEY_PEPPER: ci-only-pepper-minimum-32-bytes-xxxxxxxx
      MYCELIUM_DATABASE_URL_SYNC: postgresql+psycopg://mycelium:mycelium@localhost:5432/mycelium
      MYCELIUM_DATABASE_URL: postgresql+asyncpg://mycelium_app:mycelium_app@localhost:5432/mycelium
      MYCELIUM_DB_APP_PASSWORD: mycelium_app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Bootstrap runtime role (mycelium_app)
        run: |
          PGPASSWORD=mycelium psql -h localhost -U mycelium -d mycelium \
            -v ON_ERROR_STOP=1 -v app_pw="$MYCELIUM_DB_APP_PASSWORD" \
            -f deploy/local/bootstrap_roles.sql
      - name: Apply migrations
        run: uv run alembic -c core/alembic.ini upgrade head
      - name: Harden function ACLs (reproduce prod execute posture)
        run: |
          PGPASSWORD=mycelium psql -h localhost -U mycelium -d mycelium \
            -v ON_ERROR_STOP=1 -f deploy/local/harden_function_acls.sql
      - name: Tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint . --no-cache
      # src/shared is compiled into the browser extension as well as the
      # SPA, so an import that leaves it -- a hook, a catalogue, a store,
      # a transport -- breaks the OTHER package, later, for somebody else.
      # It cannot surface here as a type error or a lint failure: inside
      # the SPA the import resolves perfectly. Also refuses a deep import
      # past src/shared/index.ts, so the barrel stays the entry point.
      - name: Shared purity
        run: pnpm check:shared
      # Every static t('...') must resolve in src/i18n/en.ts. The SPA-side
      # port of the backend's test_i18n_catalog: without it, a missing key
      # renders either the raw dotted key or -- behind a defaultValue --
      # English in every locale, and neither shows up in a type error.
      - name: i18n keys
        run: pnpm check:i18n
      # A button that drops the accent FILL must drop the accent INK too: the
      # global `button` rule sets both, so undoing only the background leaves
      # the fill's colour over a plain surface -- white on white in light and
      # black on black in dark. It shipped three times before this check
      # existed (task 805a569c), and neither eslint nor tsc can see CSS.
      - name: Button fill/ink pairs
        run: pnpm check:css
      # Explicit, before the bundle. `pnpm build` already runs `tsc -b`
      # first, so this adds no coverage -- it buys attribution: a type
      # error surfaces as "Typecheck" instead of a Build failure whose
      # log has to be read to tell a type error from a Vite one, and it
      # fails before the bundler starts. `tsc -b` is incremental, so the
      # run inside build is then a no-op.
      # NOTE for anyone checking this locally: `tsc --noEmit` on the repo
      # root checks NOTHING (tsconfig.json is a references stub with
      # "files": []). Use `pnpm typecheck` / `npm run typecheck`.
      - name: Typecheck
        run: pnpm typecheck
      # The markdown identity corpus: every fixture in web/test/markdown-corpus
      # must come back out of the editor's document model as the bytes that
      # went in. The editor's document IS the markdown source, so this is a
      # law rather than a target, and there is no allowlist of known-lossy
      # constructs. Needs no DOM for the identity assertions (EditorState is
      # pure) and no backend at all; runs in about two seconds. After
      # Typecheck because vitest transpiles without typechecking, so a type
      # error would otherwise surface here as a confusing runtime failure.
      - name: Unit tests (markdown identity corpus)
        run: pnpm test
      - name: Build
        run: pnpm build

  # The browser extension. A separate package with its own lockfile: it
  # ships no runtime dependency at all, so React, CodeMirror and the rest
  # of the SPA's tree are not merely unused here, they are not
  # installable -- a stray import is an unresolved module rather than a
  # 900 kB popup.
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint . --no-cache
      # chrome.i18n answers an unknown key with an EMPTY STRING -- not an
      # error, not the key name, a blank where a sentence should be. So a
      # typo ships an unlabelled button, and it is invisible to anyone
      # running in the language the typo is not in.
      - name: Message catalogue
        run: pnpm check:messages
      # The /tasks search box and this panel parse the same short
      # language and must never disagree about what a token IS. A `@name`
      # meaning "tag" on one surface and something else on the other is
      # the kind of divergence nobody notices until a saved query returns
      # the wrong rows.
      - name: Query grammar
        run: pnpm check:grammar
      # The palette is EXTRACTED from web/src/index.css rather than
      # copied, so the two cannot drift. The same extractor also compares
      # the app's two dark blocks -- the explicit choice and the system
      # preference -- which were kept in step by a comment until now.
      - name: Design tokens
        run: pnpm check:tokens
      # Two projects with different libs: the service worker compiles
      # without a DOM, so `document` is not a name there, and the panel
      # documents compile without the worker globals. `tsc -b`, because
      # `tsc --noEmit` from a root with no project reference checks
      # nothing at all.
      - name: Typecheck
        run: pnpm typecheck
      # The credential handshake, the 401 path, the on/off switch at the
      # seam, and the snippet renderer against an injected tag. After
      # Typecheck, because vitest transpiles without typechecking and a
      # type error would otherwise surface here as a confusing runtime
      # failure.
      - name: Unit tests
        run: pnpm test
      # Last, and with the origin passed explicitly: there is no default,
      # so a build that reaches this step is a build that was told which
      # deployment it is for.
      #
      # `zip` rather than `build`: it runs the same build and then
      # produces the archive a deployment serves for download, plus the
      # descriptor beside it. The archive path had no gate at all until
      # now, which is how the script behind `make extension-pack` came to
      # be shadowed by pnpm's own `pack` built-in without anyone noticing
      # that the target had stopped producing an archive.
      - name: Build and package
        run: pnpm zip
        env:
          MYCELIUM_EXTENSION_ORIGIN: https://mycelium.xeno.garden

  # End-to-end browser suite (Playwright). Runs the real stack: Postgres
  # service + migrated schema + uvicorn(:8000) + the Vite dev server
  # (:5173, which proxies /api -> :8000; `vite preview` would not). The
  # spec's globalSetup bootstraps a neutral admin via the same service
  # path production uses. Same tag-push/dispatch trigger as the rest of
  # CI, so it gates releases, not every branch commit.
  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mycelium
          POSTGRES_PASSWORD: mycelium
          POSTGRES_DB: mycelium
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mycelium -d mycelium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MYCELIUM_JWT_SECRET: ci-only-secret-minimum-32-bytes-xxxxxxxx
      MYCELIUM_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Fail-closed like the JWT secret (issuer-key feature): the app boots
      # Settings directly here, with no pytest conftest default to fall
      # back on.
      MYCELIUM_ISSUER_KEY_PEPPER: ci-only-pepper-minimum-32-bytes-xxxxxxxx
      MYCELIUM_DATABASE_URL_SYNC: postgresql+psycopg://mycelium:mycelium@localhost:5432/mycelium
      MYCELIUM_DATABASE_URL: postgresql+asyncpg://mycelium_app:mycelium_app@localhost:5432/mycelium
      MYCELIUM_DB_APP_PASSWORD: mycelium_app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Bootstrap runtime role (mycelium_app)
        run: |
          PGPASSWORD=mycelium psql -h localhost -U mycelium -d mycelium \
            -v ON_ERROR_STOP=1 -v app_pw="$MYCELIUM_DB_APP_PASSWORD" \
            -f deploy/local/bootstrap_roles.sql
      - name: Apply migrations
        run: uv run alembic -c core/alembic.ini upgrade head
      - name: Harden function ACLs (reproduce prod execute posture)
        run: |
          PGPASSWORD=mycelium psql -h localhost -U mycelium -d mycelium \
            -v ON_ERROR_STOP=1 -f deploy/local/harden_function_acls.sql
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e against the live stack
        working-directory: web
        run: |
          set -euo pipefail
          # Start the API and the Vite dev server, tear both down on exit.
          ( cd .. && uv run uvicorn mycelium_api.main:app --host 0.0.0.0 --port 8000 ) &
          api_pid=$!
          pnpm dev --host 0.0.0.0 --port 5173 --strictPort &
          web_pid=$!
          trap 'kill $api_pid $web_pid 2>/dev/null || true' EXIT
          # Wait for both to answer before the browser suite starts.
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/openapi.json >/dev/null && break || sleep 1
          done
          curl -sf http://localhost:8000/openapi.json >/dev/null
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/ >/dev/null && break || sleep 1
          done
          curl -sf http://localhost:5173/ >/dev/null
          pnpm e2e
